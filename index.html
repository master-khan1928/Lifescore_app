<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MarketPro Agency</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">MarketPro</span>
      </div>
      <div class="header-sub">Digital Marketing Agency</div>
    </div>

    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="Поиск по услугам..." id="searchInput" />
      <span class="search-icon">⌕</span>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="smm">SMM</button>
      <button class="filter-btn" data-filter="seo">SEO</button>
      <button class="filter-btn" data-filter="ads">Реклама</button>
      <button class="filter-btn" data-filter="design">Дизайн</button>
      <button class="filter-btn" data-filter="strategy">Стратегия</button>
    </div>
  </header>

  <main class="main">
    <div class="section-label">Наши услуги</div>
    <div class="grid" id="serviceGrid"></div>
  </main>

  <!-- SERVICE DETAIL MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-img-wrap">
        <div class="modal-badge" id="modalBadge"></div>
        <div class="modal-img" id="modalImg"></div>
      </div>
      <div class="modal-body">
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-meta" id="modalMeta"></div>
        <div class="modal-tags" id="modalTags"></div>
        <div class="modal-desc" id="modalDesc"></div>

        <!-- Calculator -->
        <div class="calc-section" id="calcSection">
          <div class="calc-title">🧮 Калькулятор стоимости</div>
          <div class="calc-row">
            <label>Бюджет на продвижение (₽)</label>
            <input type="range" id="budgetRange" min="10000" max="500000" step="10000" value="50000">
            <div class="calc-value" id="budgetValue">50 000 ₽</div>
          </div>
          <div class="calc-row">
            <label>Срок (месяцев)</label>
            <input type="range" id="durationRange" min="1" max="12" step="1" value="3">
            <div class="calc-value" id="durationValue">3 мес</div>
          </div>
          <div class="calc-result" id="calcResult"></div>
        </div>

        <!-- Order Form -->
        <div class="form-section">
          <div class="form-title">📋 Оставить заявку</div>
          <input type="text" id="orderName" placeholder="Ваше имя" class="form-input">
          <input type="tel" id="orderPhone" placeholder="Телефон" class="form-input">
          <button class="cta-btn" id="orderBtn">Оставить заявку</button>
        </div>

        <button class="callback-btn" id="callbackBtn">📞 Заказать обратный звонок</button>
      </div>
    </div>
  </div>

  <!-- CALLBACK MODAL -->
  <div class="modal-overlay" id="callbackOverlay">
    <div class="modal callback-modal">
      <button class="modal-close" id="callbackClose">✕</button>
      <div class="modal-body">
        <div class="modal-title" style="text-align:center; margin-bottom:20px;">📞 Обратный звонок</div>
        <input type="text" id="callbackName" placeholder="Ваше имя" class="form-input">
        <input type="tel" id="callbackPhone" placeholder="Телефон" class="form-input">
        <button class="cta-btn" id="callbackSubmit">Перезвоните мне</button>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
